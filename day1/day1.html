<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .card{
            width: 300px;
            padding: 20px;
            border: 2px solid black;
            margin: 30px auto;
            border-radius: 10px;
            
        }
        .title{
            color: blue;
            text-align: center;
            font-size: 30px;
        }
        .discription{
            color: gray;
            font-size: 18px;
            text-align: center;
        }
        .price{
            color: red;
            font-weight: bold;
            font-size: 24px;
            text-align: center;
        }
        .button{
            
            background-color: green;
            color: white;
            width: 250px;
            padding: 10px;
            font-size: 20px;
        }
        img{
            width:260px ;
            height: 100px;
            border: 1px solid gray;
            padding: 20px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="image.png" alt="">
        <p class="title">Tro Khmer</p>
        <p class="discription"> Traditional Cambodia string instrument.</p>
        <p class="price">$180</p>
        <button class="button">Buy Now</button>
    </div>
</body>
</html>
