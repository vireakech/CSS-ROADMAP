<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .card{
            width:320px ;
            padding: 20px;
            margin: 30px auto;
            border: 2px solid black;
            border-radius: 10px;
            background-color: rgb(236, 231, 231);
        }
        img{
            width: 100%;
            height: 150px;
            object-fit: cover;
            
            
        }
        .title{
            color: green;
            font-size: 28px;
            text-align: center;

        }
        .prise{
            color: red;
            font-weight: bold;
            font-size: 24px;
            text-align: center;


        }
        .discription{
            color: gray;
            font-size: 16px;
            text-align: center;
            margin: 10px 0;
        }
        .btn{
            background-color: green;
            color: white;
            width: 100%;
            height: 30px;
            border: 0px;
            border-radius: 10px;
            transition: 0.3s;
        }
        .btn:hover{
            background-color: darkgreen;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="image.png" alt="">
        <p class="title">Roneat ek</p>
        <p class="discription">Tradictional khmer musical instrument</p>
        <p class="prise">$250</p>
        <button class="btn">Buy now</button>
    </div>
</body>
</html>
