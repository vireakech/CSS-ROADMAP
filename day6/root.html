<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :root{
            --primary-color:rgb(213, 39, 39);
            --secendary-color:rgb(69, 137, 69);
            --btn-color:rgb(255, 255, 255);
        }
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        body{
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .box{
            background-color: var(--primary-color);
            color: var(--btn-color);
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100px;
            height: 100px;
            font-size: 20px;
            border-radius: 20px;
            position: relative;
        }
        .fadeup{
            position: absolute;
            right: 20px;
            bottom: 20px;
            animation: fadeuper 2s linear  infinite ;
        }
        @keyframes fadeuper{
            0%{
                transform: rotate(0);
            }
            100%{
                transform: rotate(360deg);
            }
          
        }
    </style>
</head>
<body>
    <div class="box fadeup">box1</div>
</body>
</html>
