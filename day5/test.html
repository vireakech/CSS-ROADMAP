<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        body{
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .box{
            width: 100px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: cyan;
            border-radius: 10px;
        }
        .slide{
            animation: slider 2s linear infinite alternate;
        }
       @keyframes slider{
        0%{
            transform: translatey(20px);
        }
        100%{
            transform: translatey(200px);
        }
       }
      
    </style>
</head>
<body>
    <div class="box slide">box</div>
    
</body>
</html>
