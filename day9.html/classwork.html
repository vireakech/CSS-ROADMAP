<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{background: linear-gradient(rgba(224, 6, 6),rgba(255, 38, 0, 0.7),rgba(148, 19, 19, 0.9)); display: flex;justify-content: center;align-items: center;min-height: 100vh;color: white;font-family: cursive;}
        *{ margin: 0;padding: 0;box-sizing: border-box;}
        p{text-align: center;}
        img{display: block;margin: 10px auto;width: 100px;height: 100px;border-radius: 50%;border: 2px solid white;border-style: dotted;margin-bottom: 20px;}
        .container{animation: anima 2s ease-in-out infinite alternate ; width: 500px;min-height: 525px;background:linear-gradient(180deg,rgba(255, 3, 3, 0.7),rgb(9, 9, 9,0.9) ,rgb(0, 0, 0,0.8));border-radius: 20px;}
        .contact{background-color: rgb(255, 255, 255);padding: 10px 20px;border: none;border-radius: 10px;font-family: cursive;font-weight: bold;}
        .contact:hover{background-color: rgb(170, 36, 36);}
        .name{font-size: 25px;font-weight: bold;margin-bottom: 20px;}
        .role{font-size: 20px;margin-bottom: 20px;}
        .dis{font-size: 10px;margin-bottom: 20px;}
        .skill{font-size: 25px;margin-bottom: 20px;}
        .skill-me{font-size: 15px;margin-bottom: 20px;}
        @media(max-width:600px) {
            .container{
                width: 90%;
                padding: 20px;
            }
        }
        @media(min-width:601px) and (max-width:900px) {
            .container{
                width: 400px;
                padding: 30px;
            }
        }
        @media (min-width:901px){
            .container{
                width: 500px;
                padding: 40px;
            }

        }
        @keyframes anima{
            0%{transform: translateY(-20px);}
            100%{transform: translateY(20px);}
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="image.png" alt="my pf picture ">
        <p class="name">nhoa keavireakech</p>
        <p class="role">Junior Frontend Developer</p>
        <p class="dis">I am learning HTML, CSS, JavaScript and Python.</p>
        <p class="skill">skill</p>
        <p class="skill-me">HTML CSS JavaScript</p>
        <button class="contact" style="display: block;margin: 10px auto;"> Contact Me</button>
    </div>
</body>
</html>
