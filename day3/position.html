<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    .parent {
        position: relative;
        width: 300px;
        height: 200vh;
        background-color: lightblue;
    }
    .child {
        /* position: sticky; is used like nav bar when it following the scroll  */
        /* position: fixed; is not follow our scrolling  */
        /* position: absolute; we can move it to up down from original position */
        border-radius: 10px;
        position: absolute;
        right: 5px;
        bottom: 5px;
        background-color: red;
        color: white;
        padding: 10px;
    }
    </style>
</head>
<body>
    <div class="parent">
    <div class="child">Hello</div>
    </div>
</body>
</html>
