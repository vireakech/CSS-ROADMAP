<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        .parent{
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
            display: flex;
            justify-content: center;
            align-items: center;
            width: 200px;
            height: 200px;
            position: relative;
            background-color: rgb(10, 124, 162);
        }
        .box1{
            border-radius: 10px;
            text-align: center;
            color: aliceblue;
            top: 20px;
            left: 20px;
            z-index: 1;
            width: 100px;
            height: 100px;
            position: absolute;
            background-color: red;
        }
        .box2{
            text-align: center;
            border-radius: 10px;
            top: 40px;
            z-index: 2;
            left: 40px;
            width: 100px;
            height: 100px;
            color: aliceblue;
            position: absolute;
            background-color: blue;
        }
        .box3{
            box-shadow: 5px 5px 10px rgb(255, 255, 255);
            border-radius: 10px;
            text-align: center;
            color: aliceblue;
            top: 60px;
            left: 60px;
            z-index: 3;
            width: 100px;
            height: 100px;
            position: absolute;
            background-color: green
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="box1">box1</div>
        <div class="box2">box2</div>
        <div class="box3">box3</div>
    </div>
</body>
</html>
