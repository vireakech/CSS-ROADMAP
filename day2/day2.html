<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background: linear-gradient(180deg,blue,purple);
            background-repeat: no-repeat;
            min-height: 100vh;
        }
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .card{
            margin: 30px auto;
            width: 350px;
            border: 1px solid darkgoldenrod;
            background-color: white;
            height: 200px;
            border-radius: 10px;
            
        }
        .title{
            text-align: center;
            padding: 10px;
            color: blue;
           font-size: 20px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            letter-spacing: 0.1px;
        
        }
        p{
            padding: 5px;
            color: rgb(101, 98, 98);
            text-align: center;
            font-size: 16px;
            line-height: 1.6;
            margin: 15px 0;
            
        }
        .btn{
           background-color:#2563eb;
           padding: 12px 25px;
           border: none;
           border-radius: 5px;
           color: aliceblue;
           display:  block;
           margin: 10px auto;
           transition: 0.3s;
        }
        .btn:hover{
            background-color: #1d4ed8 ;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1 class="title">
            Wellcome!
        </h1>
        <p>I am a learner of HTML and CSS to build a modern website</p>
        <button class="btn">Start Learning</button>
    </div>
</body>
</html>
