<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nike Motion</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@500;700;800&display=swap');
        
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        :root {
            --red: #d91f27;
            --ink: #0d0d0f;
            --cream: #f4efe8;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            color: var(--cream);
            font-family: "Montserrat", sans-serif;
            background:
                radial-gradient(circle at 78% 18%, rgba(255, 255, 255, .12), transparent 19%),
                linear-gradient(135deg, #e62c35 0%, var(--red) 54%, #a60e19 100%);
        }

        body::before {
            content: "";
            position: fixed;
            inset: -20%;
            opacity: .09;
            background-image: repeating-linear-gradient(115deg, transparent 0 38px, #fff 39px 40px);
            transform: rotate(-4deg);
            pointer-events: none;
        }

        .shell {
            position: relative;
            z-index: 1;
            width: min(1500px, calc(100% - 80px));
            min-height: 100vh;
            margin: 0 auto;
            display: grid;
            grid-template-columns: minmax(260px, .75fr) minmax(500px, 1.25fr);
            align-items: center;
            gap: clamp(30px, 5vw, 90px);
        }

        .brand {
            position: absolute;
            top: 38px;
            left: 0;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 6px;
        }

        .brand-mark {
            width: 58px;
            height: 28px;
            filter: brightness(0) invert(1);
        }

        .copy {
            padding-top: 70px;
        }

        .eyebrow {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 18px;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        .eyebrow::before {
            content: "";
            width: 48px;
            height: 2px;
            background: currentColor;
        }

        h1 {
            max-width: 680px;
            font-family: "Bebas Neue", Impact, sans-serif;
            font-size: clamp(78px, 9vw, 156px);
            font-weight: 400;
            line-height: .78;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 12px 30px rgba(80, 0, 0, .16);
        }

        h1 span {
            display: block;
            color: transparent;
            -webkit-text-stroke: 2px var(--cream);
        }

        .tagline {
            max-width: 430px;
            margin-top: 28px;
            color: rgba(255, 255, 255, .78);
            font-size: clamp(13px, 1vw, 16px);
            line-height: 1.8;
        }

        .video-stage {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 10;
            border: 1px solid rgba(255, 255, 255, .22);
            border-radius: 18px;
            background: var(--ink);
            box-shadow: 0 35px 80px rgba(62, 0, 5, .42);
            overflow: hidden;
            transform: rotate(1.5deg);
        }

        .video-stage::after {
            content: "";
            position: absolute;
            inset: 0;
            border: 10px solid rgba(255, 255, 255, .025);
            border-radius: inherit;
            pointer-events: none;
        }

        video {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #111;
        }

        .play-button {
            position: absolute;
            z-index: 3;
            top: 50%;
            left: 50%;
            width: 82px;
            height: 82px;
            border: 0;
            border-radius: 50%;
            color: var(--ink);
            background: rgba(255, 255, 255, .94);
            box-shadow: 0 12px 40px rgba(0, 0, 0, .28);
            cursor: pointer;
            transform: translate(-50%, -50%);
            transition: transform .25s ease, opacity .25s ease;
        }

        .play-button::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 54%;
            width: 0;
            height: 0;
            border-top: 11px solid transparent;
            border-bottom: 11px solid transparent;
            border-left: 17px solid currentColor;
            transform: translate(-50%, -50%);
        }

        .play-button:hover {
            transform: translate(-50%, -50%) scale(1.08);
        }

        .video-stage.playing .play-button {
            opacity: 0;
            pointer-events: none;
        }

        .edition {
            position: absolute;
            right: 24px;
            bottom: 19px;
            z-index: 4;
            font-family: "Bebas Neue", Impact, sans-serif;
            font-size: 15px;
            letter-spacing: 3px;
            opacity: .75;
        }

        @media (max-width: 900px) {
            body {
                overflow: auto;
            }

            .shell {
                width: min(720px, calc(100% - 40px));
                min-height: 100vh;
                grid-template-columns: 1fr;
                gap: 26px;
                padding: 110px 0 45px;
            }

            .brand {
                top: 28px;
            }

            .copy {
                padding-top: 0;
            }

            h1 {
                font-size: clamp(72px, 22vw, 120px);
            }

            .tagline {
                margin-top: 20px;
            }

            .video-stage {
                transform: none;
            }
        }

        @media (max-width: 480px) {
            .shell {
                width: calc(100% - 30px);
                padding-top: 96px;
            }

            h1 {
                font-size: 68px;
            }

            .eyebrow {
                font-size: 10px;
            }

            .tagline {
                display: none;
            }

            .video-stage {
                border-radius: 10px;
                aspect-ratio: 4 / 3;
            }

            .play-button {
                width: 64px;
                height: 64px;
            }
        }
    </style>
</head>
<body>
    <main class="shell">
        <div class="brand">
            <svg class="brand-mark" viewBox="0 0 69 24" aria-hidden="true">
                <path d="M68.9 2.2c-7.1 10.2-16.3 17.4-27.2 21.5-6.5 2.4-13.3 3.1-16.7.9-2.3-1.5-3.1-4.4-2.1-7.4-2.4 1.2-4.7 2.5-7.1 4C9.4 25.5 4.1 28.1.1 26.2c-2.1-1-1.8-3.5-.2-6.2 3.2-5.3 10.1-8.7 17.3-10.6 3.8-1 7.6-1.5 11.1-1.4C30.1 4.7 33.1 1.5 36.6 0 29.2 4.8 17.8 12.1 13.3 20.4c-.9 1.6-1.5 3.1-1.7 4.5 2.5-1.9 5.2-3.6 8.1-5.2 6.7-3.7 14.1-5.7 21.8-5.7 9.7 0 20.3 1.1 27.4-11.8Z"/>
            </svg>
            <span>NIKE</span>
        </div>

        <section class="copy">
            <p class="eyebrow">Move with purpose</p>
            <h1>Just <span>Do It</span></h1>
            <p class="tagline">Built for every step. Engineered for every jump. Press play and feel the motion.</p>
        </section>

        <section class="video-stage" id="videoStage" aria-label="Nike video player">
            <video id="nikeVideo" poster="image.png" muted loop playsinline>
                <source src="nike.mp4" type="video/mp4">
                Your browser does not support HTML video.
            </video>
            <button class="play-button" id="playButton" type="button" aria-label="Play video"></button>
            <span class="edition">AIR / 001</span>
        </section>
    </main>

    <script>
        const video = document.getElementById("nikeVideo");
        const stage = document.getElementById("videoStage");
        const playButton = document.getElementById("playButton");

        playButton.addEventListener("click", () => {
            video.muted = false;
            video.play();
            stage.classList.add("playing");
        });

        video.addEventListener("click", () => {
            if (video.paused) {
                video.play();
                stage.classList.add("playing");
            } else {
                video.pause();
                stage.classList.remove("playing");
            }
        });
    </script>
</body>
</html>
